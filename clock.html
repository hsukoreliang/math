<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本學習內容：NC-2-13-1 認識鐘面刻度與報讀時刻（幾時幾分）</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts Noto Sans TC 與 Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #ecfdf5;
            color: #1e293b;
        }
        .math-font {
            font-family: 'Roboto Mono', 'Noto Sans TC', monospace;
        }
        /* 隱藏數字輸入框上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        /* 錯誤晃動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        /* 答對彈跳動畫 */
        @keyframes pop {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.35s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 sm:px-6">

    <!-- 主容器 -->
    <main class="w-full max-w-2xl space-y-5">

        <!-- 1. 學習重點提示卡 -->
        <header class="bg-white border border-emerald-200 border-l-[6px] border-l-emerald-600 rounded-r-xl rounded-l-sm shadow-sm p-4 sm:p-5">
            <h1 class="text-base sm:text-lg font-bold text-emerald-800 leading-snug mb-2.5">
                基本學習內容：NC-2-13-1 認識鐘面上的刻度結構，並報讀鐘面上的時刻是幾時幾分。
            </h1>
            <div class="text-sm sm:text-base text-slate-700 leading-relaxed space-y-1.5">
                <p>
                    <span class="font-bold text-slate-900">重點提醒：</span>
                    <span class="inline-block font-extrabold text-emerald-800 bg-emerald-100 border border-emerald-300 px-2 py-0.5 rounded-md mx-0.5">綠色短針（時針）</span>
                    看「幾時」，走過哪個數字就是幾時；
                    <span class="inline-block font-extrabold text-rose-700 bg-rose-100 border border-rose-300 px-2 py-0.5 rounded-md mx-0.5">紅色長針（分針）</span>
                    看「幾分」，走 1 小格是 1 分鐘，走 1 大格是 5 分鐘！
                </p>
            </div>
        </header>

        <!-- 小節標題與進度指示 -->
        <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
            <div class="flex items-center gap-2.5">
                <span class="w-1.5 h-6 bg-emerald-600 rounded-full inline-block"></span>
                <h2 class="text-lg sm:text-xl font-bold text-slate-800">
                    認識鐘面刻度與報讀時刻
                </h2>
            </div>
            <span id="progress-badge" class="text-xs sm:text-sm font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-900">
                學習單原題：第 1 題 / 共 6 題
            </span>
        </div>

        <!-- 2. 單題互動卡片 -->
        <section class="bg-white border-2 border-slate-300 rounded-2xl shadow-md overflow-hidden">

            <!-- 頂部題型標籤與分鐘刻度提示開關 -->
            <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border-b border-slate-200 py-3.5 px-4 sm:px-6 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span id="question-number-badge" class="math-font text-sm sm:text-base font-extrabold text-emerald-900 bg-white px-2.5 py-0.5 rounded-md border border-emerald-300">
                        (1)
                    </span>
                    <span id="category-badge" class="px-3 py-1 rounded-lg text-xs sm:text-sm font-extrabold bg-emerald-600 text-white shadow-2xs">
                        看鐘面報讀時刻

                </div>

                <!-- 顯示分鐘刻度提示（5、10、15...）開關 -->
                <button type="button" id="btn-toggle-minute-hint" onclick="toggleMinuteHint()"

                <div id="clock-svg-wrapper" class="w-full max-w-[270px] sm:max-w-[300px] aspect-square flex items-center justify-center mb-4">
                    <svg id="clock-svg" viewBox="-145 -145 290 290" class="w-full h-full drop-shadow-sm select-none" aria-label="互動數學鐘面">

        <footer class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 pt-1">
            <button type="button" id="btn-check" onclick="checkAnswer()"

            <!-- 統計數據卡片列（總作答次數、答對次數、答對率） -->

            <!-- 作答紀錄表格 -->
            <div class="overflow-x-auto max-h-80 overflow-y-auto">

                                尚未有作答紀錄，按下「對答案」後會自動記錄在這裡！

    </main>

    <script>
        /**
         * 題庫設定：
         * 先呈現學習單原題（共 6 題，題號以 (1)、(2)... 顯示）：
         * (1) 類別 A：看鐘面報讀時刻（7 時 15 分）
         * (2) 類別 A：看鐘面報讀時刻（9 時 30 分）
         * (3) 類別 A：看鐘面報讀時刻（1 時 42 分）
         * (4) 類別 A：看鐘面報讀時刻（11 時 55 分）
         * (5) 類別 B：認識鐘面刻度，填填看（鐘面上一共有 [12] 個大格；1 個大格裡面有 [5] 個小格，全部共有 [60] 小格。）
         * (6) 類別 B：認識鐘面刻度，填填看（分針從 12 走到 4，走了 [4] 大格，也就是 [20] 分鐘。）
         * 
         * 第 7 題起：點擊「下一題」自動在類別 A 與類別 B 之間輪流或隨機出題。
         */
        const presetQuestions = [
            {
                kind: 'A',
                subType: 'time_reading',
                category: '看鐘面報讀時刻',
                labelNo: 1,
                hour: 7,
                minute: 15,
                answers: [7, 15],
                questionSummary: '報讀鐘面時刻（指針指向 7 時 15 分）',
                correctDisplay: '7 時 15 分'
            },
            {
                kind: 'A',
                subType: 'time_reading',
                category: '看鐘面報讀時刻',
                labelNo: 2,
                hour: 9,
                minute: 30,
                answers: [9, 30],
                questionSummary: '報讀鐘面時刻（指針指向 9 時 30 分）',
                correctDisplay: '9 時 30 分'
            },
            {
                kind: 'A',
                subType: 'time_reading',
                category: '看鐘面報讀時刻',
                labelNo: 3,
                hour: 1,
                minute: 42,
                answers: [1, 42],
                questionSummary: '報讀鐘面時刻（指針指向 1 時 42 分）',
                correctDisplay: '1 時 42 分'
            },
            {
                kind: 'A',
                subType: 'time_reading',
                category: '看鐘面報讀時刻',
                labelNo: 4,
                hour: 11,
                minute: 55,
                answers: [11, 55],
                questionSummary: '報讀鐘面時刻（指針指向 11 時 55 分）',
                correctDisplay: '11 時 55 分'
            },
            {
                kind: 'B',
                subType: 'scale_structure',
                category: '認識鐘面刻度，填填看',
                labelNo: 5,
                showHands: false,
                answers: [12, 5, 60],
                questionSummary: '鐘面上一共有 ( ) 個大格；1 個大格裡面有 ( ) 個小格，全部共有 ( ) 小格。',
                correctDisplay: '12 大格、5 小格、共 60 小格'
            },
            {
                kind: 'B',
                subType: 'minute_steps',
                category: '認識鐘面刻度，填填看',
                labelNo: 6,
                targetNumber: 4,
                showHands: true,
                hour: 12,
                minute: 20,
                answers: [4, 20],
                questionSummary: '分針從 12 走到 4，走了 ( ) 大格，也就是 ( ) 分鐘。',
                correctDisplay: '4 大格、20 分鐘'
            }
        ];

        const STORAGE_KEY = 'nc_2_13_1_clock_practice_history_v1';

        let currentIndex = 0;
        let currentQuestion = Object.assign({}, presetQuestions[0]);
        let solvedCount = 0;
        let attemptHistory = [];
        let showMinuteHint = false;
        let isCurrentSolved = false;
        let confirmClearTimeout = null;
        let randomToggleKind = 'A'; // 第 7 題起交替出題輔助

        /**
         * 產生後續隨機題目（輪流或隨機出類別 A 報讀時刻與類別 B 分針走幾大格/幾分鐘）
         */
        function generateRandomQuestion(index) {
            const labelNo = index + 1;
            const kind = randomToggleKind;
            randomToggleKind = kind === 'A' ? 'B' : 'A';

            if (kind === 'A') {
                const hour = Math.floor(Math.random() * 12) + 1; // 1 ~ 12 時
                // 60% 產生 5 的倍數分鐘，40% 產生精確到 1 分鐘的題目
                const minute = Math.random() < 0.6
                    ? Math.floor(Math.random() * 12) * 5
                    : Math.floor(Math.random() * 60);

                return {
                    kind: 'A',
                    subType: 'time_reading',
                    category: '看鐘面報讀時刻',
                    labelNo,
                    hour,
                    minute,
                    answers: [hour, minute],
                    questionSummary: `報讀鐘面時刻（指針指向 ${hour} 時 ${minute} 分）`,
                    correctDisplay: `${hour} 時 ${minute} 分`
                };
            } else {
                // 類別 B：分針從 12 走到 N (1 ~ 11 大格)
                const targetNum = Math.floor(Math.random() * 11) + 1;
                const mins = targetNum * 5;
                return {
                    kind: 'B',
                    subType: 'minute_steps',
                    category: '認識鐘面刻度，填填看',
                    labelNo,
                    targetNumber: targetNum,
                    showHands: true,
                    hour: 12,
                    minute: mins,
                    answers: [targetNum, mins],
                    questionSummary: `分針從 12 走到 ${targetNum}，走了 ( ) 大格，也就是 ( ) 分鐘。`,
                    correctDisplay: `${targetNum} 大格、${mins} 分鐘`
                };
            }
        }

        /**
         * 動態繪製高解析度 SVG 鐘面
         * 包含：60 個小格刻度、12 個大格粗刻度、1~12 數字環繞、可選分鐘刻度提示（5、10、15...）、
         * 綠色短針（時針）與紅色長針（分針）、中心圓軸。
         */
        function renderClockSVG(question) {
            const svg = document.getElementById('clock-svg');
            if (!svg) return;

            const parts = [];

            // 外框與鐘面底盤
            parts.push(`<circle cx="0" cy="0" r="118" fill="#ffffff" stroke="#0f172a" stroke-width="5" />`);
            parts.push(`<circle cx="0" cy="0" r="112" fill="none" stroke="#cbd5e1" stroke-width="1.2" />`);

            // 60 個小格刻度與 12 個大格粗刻度
            for (let i = 0; i < 60; i++) {
                const angleDeg = i * 6;
                const rad = (angleDeg - 90) * (Math.PI / 180);
                const isHourMark = i % 5 === 0;

                const outerR = 110;
                const innerR = isHourMark ? 94 : 102;
                const strokeW = isHourMark ? 3.5 : 1.4;
                const strokeCol = isHourMark ? '#0f172a' : '#475569';

                const x1 = (innerR * Math.cos(rad)).toFixed(2);
                const y1 = (innerR * Math.sin(rad)).toFixed(2);
                const x2 = (outerR * Math.cos(rad)).toFixed(2);
                const y2 = (outerR * Math.sin(rad)).toFixed(2);

                parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeCol}" stroke-width="${strokeW}" stroke-linecap="round" />`);
            }

            // 1 ~ 12 數字環繞排列
            const numRadius = 78;
            for (let h = 1; h <= 12; h++) {
                const rad = (h * 30 - 90) * (Math.PI / 180);
                const x = (numRadius * Math.cos(rad)).toFixed(2);
                const y = (numRadius * Math.sin(rad)).toFixed(2);
                const fontWeight = (h === 12 || h === 3 || h === 6 || h === 9) ? '800' : '700';

                parts.push(`
                    <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
                        font-size="16" font-weight="${fontWeight}" fill="#0f172a"
                        font-family="'Roboto Mono', 'Noto Sans TC', sans-serif">${h}</text>
                `);
            }

            // 可選：分鐘刻度提示（5、10、15...55、60/0）
            if (showMinuteHint) {
                const hintRadius = 131;
                for (let m = 5; m <= 60; m += 5) {
                    const rad = (m * 6 - 90) * (Math.PI / 180);
                    const x = (hintRadius * Math.cos(rad)).toFixed(2);
                    const y = (hintRadius * Math.sin(rad)).toFixed(2);
                    const label = m === 60 ? '60(0)' : String(m);

                    parts.push(`
                        <rect x="${(Number(x) - 13).toFixed(1)}" y="${(Number(y) - 8).toFixed(1)}" width="26" height="16" rx="6"
                            fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
                        <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
                            font-size="8.5" font-weight="800" fill="#92400e"
                            font-family="'Roboto Mono', sans-serif">${label}</text>
                    `);
                }
            }

            // 繪製指針（類別 A 或類別 B 分針走格題）
            const shouldDrawHands = question.kind === 'A' || (question.kind === 'B' && question.showHands);

            if (shouldDrawHands) {
                const hr = question.hour ?? 12;
                const min = question.minute ?? 0;

                // 時針角度 = (hour % 12) * 30 + minute * 0.5（綠色短針）
                const hourAngle = ((hr % 12) * 30 + min * 0.5 - 90) * (Math.PI / 180);
                const hourLen = 52;
                const hx = (hourLen * Math.cos(hourAngle)).toFixed(2);
                const hy = (hourLen * Math.sin(hourAngle)).toFixed(2);

                // 分針角度 = minute * 6（紅色長針）
                const minAngle = (min * 6 - 90) * (Math.PI / 180);
                const minLen = 84;
                const mx = (minLen * Math.cos(minAngle)).toFixed(2);
                const my = (minLen * Math.sin(minAngle)).toFixed(2);

                // 類別 B 分針走格題時，若只聚焦分針可將時針淡化或保留參考
                const hourOpacity = question.kind === 'B' ? '0.35' : '1';

                // 綠色短針（時針）
                parts.push(`
                    <line x1="0" y1="0" x2="${hx}" y2="${hy}"
                        stroke="#059669" stroke-opacity="${hourOpacity}" stroke-width="7.5" stroke-linecap="round" />
                `);

                // 紅色長針（分針）
                parts.push(`
                    <line x1="0" y1="0" x2="${mx}" y2="${my}"
                        stroke="#e11d48" stroke-width="4.2" stroke-linecap="round" />
                `);
            }

            // 中心圓軸
            parts.push(`<circle cx="0" cy="0" r="6.5" fill="#0f172a" />`);
            parts.push(`<circle cx="0" cy="0" r="2.5" fill="#ffffff" />`);

            svg.innerHTML = parts.join('');
        }

        /**
         * 切換顯示／隱藏分鐘刻度提示（5、10、15...）
         */
        function toggleMinuteHint() {
            showMinuteHint = !showMinuteHint;
            const btnText = document.getElementById('minute-hint-btn-text');
            if (btnText) {
                btnText.textContent = showMinuteHint
                    ? '隱藏分鐘刻度提示'
                    : '顯示分鐘刻度提示（5、10、15...）';
            }
            renderClockSVG(currentQuestion);
        }

        /**
         * 載入題目並更新介面
         */
        function loadQuestion(index) {
            currentIndex = index;
            isCurrentSolved = false;

            const progressBadge = document.getElementById('progress-badge');
            const numBadge = document.getElementById('question-number-badge');
            const catBadge = document.getElementById('category-badge');
            const feedbackBox = document.getElementById('feedback-box');

            if (index < presetQuestions.length) {
                currentQuestion = Object.assign({}, presetQuestions[index]);
                if (progressBadge) {
                    progressBadge.textContent = `學習單原題：第 ${index + 1} 題 / 共 ${presetQuestions.length} 題`;
                }
            } else {
                currentQuestion = generateRandomQuestion(index);
                if (progressBadge) {
                    progressBadge.textContent = `隨機練習：第 ${index + 1} 題（已答對 ${solvedCount} 題）`;
                }
            }

            if (numBadge) {
                numBadge.textContent = `(${currentQuestion.labelNo})`;
            }

            if (catBadge) {
                catBadge.textContent = currentQuestion.category;
                if (currentQuestion.kind === 'A') {
                    catBadge.className = 'px-3 py-1 rounded-lg text-xs sm:text-sm font-extrabold bg-emerald-600 text-white shadow-2xs';
                } else {
                    catBadge.className = 'px-3 py-1 rounded-lg text-xs sm:text-sm font-extrabold bg-teal-600 text-white shadow-2xs';
                }
            }

            renderClockSVG(currentQuestion);
            renderQuestionArea(currentQuestion);

            if (feedbackBox) {
                feedbackBox.innerHTML = `<p class="text-slate-400 text-sm text-center">請填寫答案後按 Enter 鍵，或點擊下方「對答案」按鈕</p>`;
            }
        }

        /**
         * 根據題型渲染輸入框與題目敘述
         */
        function renderQuestionArea(q) {
            const area = document.getElementById('question-content-area');
            if (!area) return;

            const boxClass = 'ans-input math-font text-center text-xl sm:text-2xl font-extrabold text-emerald-900 bg-emerald-50/60 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/20 focus:bg-white transition-all py-2 px-2.5 w-20 sm:w-24';

            let html = '';

            if (q.kind === 'A') {
                // 類別 A：看鐘面報讀時刻（[ ] 時 [ ] 分）
                html = `
                    <div class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
                        <span class="math-font text-emerald-700">(${q.labelNo})</span>
                        <span>現在是</span>
                        <input type="text" id="ans-0" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="幾時"
                            class="${boxClass}" />
                        <span>時</span>
                        <input type="text" id="ans-1" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="幾分"
                            class="${boxClass}" />
                        <span>分</span>
                    </div>
                `;
            } else if (q.subType === 'scale_structure') {
                // 類別 B 原題 1：鐘面上一共有 [12] 個大格；1 個大格裡面有 [5] 個小格，全部共有 [60] 小格。
                html = `
                    <div class="w-full max-w-xl bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5 text-base sm:text-xl leading-loose text-center">
                        <span class="math-font font-extrabold text-emerald-700 mr-1">(${q.labelNo})</span>
                        鐘面上一共有
                        <input type="text" id="ans-0" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="大格數"
                            class="${boxClass} inline-block mx-1 align-middle" />
                        個大格；1 個大格裡面有
                        <input type="text" id="ans-1" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="每大格小格數"
                            class="${boxClass} inline-block mx-1 align-middle" />
                        個小格，全部共有
                        <input type="text" id="ans-2" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="全部小格數"
                            class="${boxClass} inline-block mx-1 align-middle" />
                        小格。
                    </div>
                `;
            } else if (q.subType === 'minute_steps') {
                // 類別 B 原題 2 與隨機分針走格題：分針從 12 走到 N，走了 [ ] 大格，也就是 [ ] 分鐘。
                html = `
                    <div class="w-full max-w-xl bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5 text-base sm:text-xl leading-loose text-center">
                        <span class="math-font font-extrabold text-emerald-700 mr-1">(${q.labelNo})</span>
                        分針從 <span class="math-font font-extrabold text-slate-900">12</span> 走到
                        <span class="math-font font-extrabold text-rose-600">${q.targetNumber}</span>，走了
                        <input type="text" id="ans-0" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="走了幾大格"
                            class="${boxClass} inline-block mx-1 align-middle" />
                        大格，也就是
                        <input type="text" id="ans-1" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="走了幾分鐘"
                            class="${boxClass} inline-block mx-1 align-middle" />
                        分鐘。
                    </div>
                `;
            }

            area.innerHTML = html;

            // 綁定輸入框數字過濾、Enter 鍵送出與 Backspace 跳回前一格
            const inputs = Array.from(area.querySelectorAll('.ans-input'));
            inputs.forEach((inp, idx) => {
                inp.addEventListener('input', () => {
                    resetSingleInputStyle(inp);
                    inp.value = inp.value.replace(/[^0-9]/g, '');
                });

                inp.addEventListener('focus', () => {
                    inp.select();
                });

                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (idx < inputs.length - 1 && inputs[idx + 1].value.trim() === '') {
                            inputs[idx + 1].focus();
                        } else if (isCurrentSolved) {
                            nextQuestion();
                        } else {
                            checkAnswer();
                        }
                    } else if (e.key === 'Backspace' && inp.value === '' && idx > 0) {
                        e.preventDefault();
                        inputs[idx - 1].focus();
                    }
                });
            });

            if (inputs[0]) {
                inputs[0].focus();
            }
        }

        /**
         * 重置單一輸入框樣式
         */
        function resetSingleInputStyle(inp) {
            inp.classList.remove(
                'border-red-500', 'bg-red-50', 'text-red-700', 'animate-shake',
                'border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'animate-pop',
                'border-amber-400', 'bg-amber-50'
            );
            inp.classList.add('border-slate-300', 'bg-emerald-50/60', 'text-emerald-900');
        }

        /**
         * 對答案邏輯
         */
        function checkAnswer() {
            const area = document.getElementById('question-content-area');
            const feedbackBox = document.getElementById('feedback-box');
            if (!area || !feedbackBox) return;

            const inputs = Array.from(area.querySelectorAll('.ans-input'));
            const q = currentQuestion;

            // 1. 檢查是否所有方框皆已填寫
            let firstEmpty = null;
            inputs.forEach(inp => {
                if (inp.value.trim() === '') {
                    inp.classList.remove('border-slate-300', 'bg-emerald-50/60');
                    inp.classList.add('border-amber-400', 'bg-amber-50');
                    if (!firstEmpty) firstEmpty = inp;
                }
            });

            if (firstEmpty) {
                feedbackBox.innerHTML = `
                    <div class="w-full py-2.5 px-4 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-center font-medium text-sm sm:text-base">
                        ⚠️ 還有空格沒有填寫喔！請把每個方框都填上數字再按「對答案」。
                    </div>
                `;
                firstEmpty.focus();
                return;
            }

            // 2. 比對答案
            const userVals = inputs.map(inp => Number(inp.value.trim()));
            const results = userVals.map((val, idx) => val === q.answers[idx]);
            const isAllCorrect = results.every(Boolean);

            inputs.forEach(resetSingleInputStyle);
            void feedbackBox.offsetWidth;

            // 組合使用者作答顯示文字
            let userDisplay = '';
            if (q.kind === 'A') {
                userDisplay = `${userVals[0]} 時 ${userVals[1]} 分`;
            } else if (q.subType === 'scale_structure') {
                userDisplay = `${userVals[0]} 大格、${userVals[1]} 小格、共 ${userVals[2]} 小格`;
            } else {
                userDisplay = `${userVals[0]} 大格、${userVals[1]} 分鐘`;
            }

            // 寫入作答紀錄
            addAttemptRecord({
                labelNo: q.labelNo,
                category: q.category,
                questionText: `(${q.labelNo}) ${q.questionSummary}`,
                userAnswer: userDisplay,
                correctAnswer: q.correctDisplay,
                isCorrect: isAllCorrect
            });

            // 3. 顯示回饋與教學提示
            if (isAllCorrect) {
                isCurrentSolved = true;
                inputs.forEach(inp => {
                    inp.classList.remove('border-slate-300', 'bg-emerald-50/60', 'text-emerald-900');
                    inp.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700', 'animate-pop');
                });

                feedbackBox.innerHTML = `
                    <div class="w-full py-3 px-4 rounded-xl bg-emerald-50 border-2 border-emerald-400 text-emerald-800 text-center font-bold text-base sm:text-lg shadow-2xs animate-pop">
                        ✅ 答對了！正確答案是 <span class="math-font underline">${q.correctDisplay}</span>
                    </div>
                `;

                if (!q.solved) {
                    q.solved = true;
                    solvedCount++;
                    if (currentIndex >= presetQuestions.length) {
                        const badge = document.getElementById('progress-badge');
                        if (badge) {
                            badge.textContent = `隨機練習：第 ${currentIndex + 1} 題（已答對 ${solvedCount} 題）`;
                        }
                    }
                }
            } else {
                isCurrentSolved = false;
                let firstWrong = null;

                inputs.forEach((inp, idx) => {
                    if (results[idx]) {
                        inp.classList.remove('border-slate-300', 'bg-emerald-50/60', 'text-emerald-900');
                        inp.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                    } else {
                        inp.classList.remove('border-slate-300', 'bg-emerald-50/60', 'text-emerald-900');
                        inp.classList.add('border-red-500', 'bg-red-50', 'text-red-700', 'animate-shake');
                        if (!firstWrong) firstWrong = inp;
                    }
                });

                let hint = '再仔細看一看刻度與指針的位置喔！';
                if (q.kind === 'A') {
                    if (!results[0] && results[1]) {
                        if (q.hour === 11 && q.minute >= 45) {
                            hint = '綠色短針（時針）雖然很靠近 12，但「還沒走過 12」，所以還是 11 時喔！';
                        } else {
                            hint = '看「綠色短針（時針）」走過哪個數字就是幾時，注意不要看成下一個數字喔！';
                        }
                    } else if (results[0] && !results[1]) {
                        hint = '看「紅色長針（分針）」：先找最近的大格（5、10、15...），再往後數幾小格（1 小格 1 分鐘）！';
                    }
                } else if (q.subType === 'minute_steps') {
                    hint = `分針從 12 走到 ${q.targetNumber} 走了 ${q.targetNumber} 大格，1 大格是 5 分鐘，所以是 ${q.targetNumber} × 5 = ${q.minute} 分鐘。`;
                }

                feedbackBox.innerHTML = `
                    <div class="w-full py-2.5 px-4 rounded-xl bg-red-50 border border-red-300 text-red-700 text-center font-medium text-sm sm:text-base animate-shake">
                        ❌ 再算算看！${hint}
                    </div>
                `;

                if (firstWrong) {
                    firstWrong.focus();
                    firstWrong.select();
                }
            }
        }

        /**
         * 切換下一題
         */
        function nextQuestion() {
            loadQuestion(currentIndex + 1);
        }

        /* ================= 作答紀錄與統計管理 ================= */

        function loadHistoryFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        attemptHistory = parsed;
                    }
                }
            } catch (e) {
                attemptHistory = [];
            }
            renderHistory();
        }

        function saveHistoryToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptHistory));
            } catch (e) {
                // 忽略儲存空間限制
            }
        }

        function addAttemptRecord({ labelNo, category, questionText, userAnswer, correctAnswer, isCorrect }) {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            attemptHistory.push({
                seq: attemptHistory.length + 1,
                labelNo,
                category,
                questionText,
                userAnswer,
                correctAnswer,
                isCorrect,
                timestamp: timeStr
            });

            saveHistoryToStorage();
            renderHistory();
        }

        function renderHistory() {
            const total = attemptHistory.length;
            const correctTotal = attemptHistory.filter(r => r.isCorrect).length;
            const accuracy = total === 0 ? 0 : Math.round((correctTotal / total) * 100);

            const elTotal = document.getElementById('stat-total');
            const elCorrect = document.getElementById('stat-correct');
            const elAccuracy = document.getElementById('stat-accuracy');

            if (elTotal) elTotal.textContent = total;
            if (elCorrect) elCorrect.textContent = correctTotal;
            if (elAccuracy) elAccuracy.textContent = `${accuracy}%`;

            const tbody = document.getElementById('history-table-body');
            if (!tbody) return;

            if (total === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-slate-400 text-sm">
                            尚未有作答紀錄，按下「對答案」後會自動記錄在這裡！
                        </td>
                    </tr>
                `;
                return;
            }

            const reversed = [...attemptHistory].reverse();
            tbody.innerHTML = reversed.map(rec => {
                const badgeStyle = rec.category === '看鐘面報讀時刻'
                    ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                    : 'bg-teal-50 text-teal-800 border-teal-200';

                const statusBadge = rec.isCorrect
                    ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">✅ 正確</span>`
                    : `<div class="flex flex-col items-center gap-0.5">
                           <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-700">❌ 錯誤</span>
                           <span class="text-[11px] text-slate-500">正解：<strong class="text-slate-700">${rec.correctAnswer}</strong></span>
                       </div>`;

                const userStyle = rec.isCorrect ? 'text-emerald-700' : 'text-red-600';

                return `
                    <tr class="hover:bg-emerald-50/30 transition-colors">
                        <td class="py-2.5 px-3 sm:px-4 text-center math-font font-bold text-slate-500">
                            #${rec.seq}
                        </td>
                        <td class="py-2.5 px-3 sm:px-4">
                            <span class="math-font font-extrabold text-slate-700 mr-1">(${rec.labelNo})</span>
                            <span class="inline-block px-2 py-0.5 rounded border text-xs font-bold ${badgeStyle}">${rec.category}</span>
                        </td>
                        <td class="py-2.5 px-3 sm:px-4 font-medium text-slate-800">
                            ${rec.questionText}
                        </td>
                        <td class="py-2.5 px-3 sm:px-4 font-extrabold ${userStyle}">
                            ${rec.userAnswer}
                        </td>
                        <td class="py-2.5 px-3 sm:px-4 text-center">
                            ${statusBadge}
                        </td>
                        <td class="py-2.5 px-3 sm:px-4 math-font text-slate-500 text-xs">
                            ${rec.timestamp}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function requestClearHistory() {
            const btn = document.getElementById('btn-clear-history');
            if (!btn || attemptHistory.length === 0) return;

            if (btn.dataset.confirming === 'true') {
                attemptHistory = [];
                saveHistoryToStorage();
                renderHistory();
                btn.dataset.confirming = 'false';
                btn.innerHTML = `<span>🗑️</span><span>清除紀錄</span>`;
                btn.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-red-600 bg-white border border-red-200 hover:bg-red-50 active:scale-95 transition-all flex items-center gap-1 shadow-2xs cursor-pointer';
                if (confirmClearTimeout) clearTimeout(confirmClearTimeout);
            } else {
                btn.dataset.confirming = 'true';
                btn.innerHTML = `<span>⚠️</span><span>確定清除？</span>`;
                btn.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-white bg-red-600 border border-red-600 hover:bg-red-700 active:scale-95 transition-all flex items-center gap-1 shadow-2xs cursor-pointer';
                confirmClearTimeout = setTimeout(() => {
                    btn.dataset.confirming = 'false';
                    btn.innerHTML = `<span>🗑️</span><span>清除紀錄</span>`;
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-red-600 bg-white border border-red-200 hover:bg-red-50 active:scale-95 transition-all flex items-center gap-1 shadow-2xs cursor-pointer';
                }, 3500);
            }
        }

        function exportCSV() {
            const feedbackBox = document.getElementById('feedback-box');
            if (attemptHistory.length === 0) {
                if (feedbackBox) {
                    feedbackBox.innerHTML = `
                        <div class="w-full py-2.5 px-4 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-center font-medium text-sm">
                            ℹ️ 目前沒有作答紀錄可以匯出喔！
                        </div>
                    `;
                }
                return;
            }

            const headers = ['序號', '題號', '題型', '題目內容', '使用者輸入', '正確答案', '是否正確', '作答時間'];
            const rows = attemptHistory.map(r => [
                r.seq,
                `"(${r.labelNo})"`,
                `"${r.category}"`,
                `"${r.questionText}"`,
                `"${r.userAnswer}"`,
                `"${r.correctAnswer}"`,
                r.isCorrect ? '是' : '否',
                r.timestamp
            ]);

            const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const dateTag = new Date().toISOString().slice(0, 10);
            link.setAttribute('href', url);
            link.setAttribute('download', `認識鐘面刻度與報讀時刻作答紀錄_${dateTag}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        /* ================= 初始化啟動 ================= */
        let isInitialized = false;
        function init() {
            if (isInitialized) return;
            isInitialized = true;
            loadHistoryFromStorage();
            loadQuestion(0);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
